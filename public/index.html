    if(!el){ alert('Gera o PIX primeiro!'); return; }
    var texto = el.innerText.trim();
    if(!texto || texto.length < 20){ alert('Gera o PIX primeiro!'); return; }
    navigator.clipboard.writeText(texto).then(function(){
      var btn = document.getElementById('btnCopiarPixFlutuante');
      if(btn){ btn.innerHTML = '✅ COPIADO!'; setTimeout(function(){ btn.innerHTML = '📋 COPIAR PIX'; }, 2000); }
    });
  }
  function criarBotao(){
    if(document.getElementById('btnCopiarPixFlutuante')) return;
    var btn = document.createElement('button');
    btn.id = 'btnCopiarPixFlutuante';
    btn.innerHTML = '📋 COPIAR PIX';
    btn.style = 'position:fixed; bottom:20px; right:20px; background:#7c3aed; color:white; padding:18px 26px; border-radius:14px; border:none; font-weight:800; z-index:99999; cursor:pointer; box-shadow:0 8px 20px rgba(124,58,237,0.5); font-size:15px; display:none;';
    btn.onclick = copiarPix;
    document.body.appendChild(btn);
    setInterval(function(){
      var el = document.querySelector('.break-all');
      btn.style.display = (el && el.innerText.length > 20) ? 'block' : 'none';
    }, 500);
  }
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', criarBotao) : criarBotao();
})();
</script>
